version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metalsense-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_ORIGIN=http://localhost:5000
      - API_PREFIX=/api/v1
      - SESSION_SECRET=production_super_secret_jwt_key_at_least_32_characters_long
      - MONGODB_URI=mongodb://mongodb:27017/metalsense
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - metalsense-network

  mongodb:
    image: mongo:7-jammy
    container_name: metalsense-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - metalsense-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  metalsense-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
